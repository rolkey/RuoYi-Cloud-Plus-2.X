# Tomcat
server:
  port: 9202

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-gen
  profiles:
    # 环境配置
    active: @profiles.active@

--- # nacos 配置
spring:
  cloud:
    # 打包环境
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 注册组
        group: @nacos.discovery.group@
        namespace: ${spring.profiles.active}
        #        ip: @client.ip@
      config:
        # 配置组
        group: @nacos.config.group@
        namespace: ${spring.profiles.active}

    # 开发环境
  #    nacos:
  #      # nacos 服务地址
  #      server-addr: 192.168.168.128:8848
  #      username: nacos
  #      password: nacos
  #      discovery:
  #        # 注册组
  #        group: DEFAULT_GROUP
  #        namespace: prod
  #        #        ip: @client.ip@
  #        ip: 192.168.168.1
  #      config:
  #        # 配置组
  #        group: DEFAULT_GROUP
  #        namespace: prod

  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:datasource.yml
      - optional:nacos:${spring.application.name}.yml
